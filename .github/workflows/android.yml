name: ساخت APK اندروید

# با هر push (یا اجرای دستی) نسخه APK به‌صورت خودکار ساخته می‌شود و:
#   ۱) در تب Actions → Artifacts گذاشته می‌شود
#   ۲) مستقیماً روی سایت اپ آپلود می‌شود (دانلود بدون لاگین):
#      https://mayanamin1813-cloud.github.io/sarkhat/apk/SarkhatBot.apk
on:
  push:
    branches: [ main, master ]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب جاوا ۱۷
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: نصب گریدل
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: ساخت نسخه Debug (قابل نصب)
        run: gradle -p mobile assembleDebug --no-daemon

      - name: ساخت نسخه Release (امضا شده با کلید تست)
        run: gradle -p mobile assembleRelease --no-daemon

      - name: آپلود فایل‌های APK
        uses: actions/upload-artifact@v4
        with:
          name: SarkhatBot-APK
          path: mobile/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: پیوست APK به Release (فقط برای تگ‌ها)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/app/build/outputs/apk/**/*.apk

      - name: انتشار APK روی سایت (دانلود مستقیم بدون لاگین)
        run: |
          if ! git ls-remote --exit-code --heads "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages >/dev/null 2>&1; then
            echo "gh-pages هنوز ساخته نشده — بعد از اولین انتشار Pages اضافه می‌شود"
            exit 0
          fi
          git clone --depth 1 --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ghp
          mkdir -p ghp/apk
          cp mobile/app/build/outputs/apk/debug/app-debug.apk ghp/apk/SarkhatBot.apk
          cp mobile/app/build/outputs/apk/release/app-release.apk ghp/apk/SarkhatBot-release.apk 2>/dev/null || true
          cd ghp
          git config user.name "sarkhat-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "APK بدون تغییر"; exit 0; fi
          git commit --amend -m "نسخه جدید APK — $(date -u '+%Y-%m-%d %H:%M')" >/dev/null
          git push --force origin gh-pages
          echo "APK روی سایت منتشر شد: /apk/SarkhatBot.apk"
