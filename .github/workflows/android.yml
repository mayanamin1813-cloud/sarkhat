name: ساخت APK اندروید

# با هر push (یا اجرای دستی) نسخه APK به‌صورت خودکار ساخته می‌شود و:
#   ۱) در تب Actions → Artifacts گذاشته می‌شود
#   ۲) مستقیماً روی سایت اپ آپلود می‌شود (دانلود بدون لاگین):
#      https://mayanamin1813-cloud.github.io/sarkhat/apk/SarkhatBot.apk
on:
  push:
    branches: [ main, master ]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gh-pages-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب جاوا ۱۷
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: نصب گریدل
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: ساخت نسخه Debug (قابل نصب)
        run: gradle -p mobile assembleDebug --no-daemon

      - name: ساخت نسخه Release (امضا شده با کلید تست)
        run: gradle -p mobile assembleRelease --no-daemon

      - name: آپلود فایل‌های APK
        uses: actions/upload-artifact@v4
        with:
          name: SarkhatBot-APK
          path: mobile/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: پیوست APK به Release (فقط برای تگ‌ها)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/app/build/outputs/apk/**/*.apk

      - name: انتشار APK روی سایت (دانلود مستقیم بدون لاگین)
        run: |
          mkdir -p webapp/data webapp/apk
          if git clone --depth 1 --branch gh-pages \
              "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ghp 2>/dev/null; then
            cp -f ghp/data/live.json webapp/data/ 2>/dev/null || true
            cp -f ghp/data/brain_state.json webapp/data/ 2>/dev/null || true
            echo "دیتای زنده بازیابی شد"
          fi
          cp mobile/app/build/outputs/apk/debug/app-debug.apk webapp/apk/SarkhatBot.apk
          cp mobile/app/build/outputs/apk/release/app-release.apk webapp/apk/SarkhatBot-release.apk 2>/dev/null || true
          # APK جدید را در شاخه حافظه هم نگه می‌داریم تا انتشارهای بعدی از دست نرود
          if [ -d ghp ]; then
            mkdir -p ghp/apk
            cp -f webapp/apk/*.apk ghp/apk/
            cd ghp
            git config user.name "sarkhat-bot"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit --amend -m "نسخه جدید APK — $(date -u '+%Y-%m-%d %H:%M')" >/dev/null
            git push --force origin gh-pages
            cd "${GITHUB_WORKSPACE}"
          else
            echo "شاخه حافظه هنوز نیست — مغز ابری بعدی APK را نگه می‌دارد"
          fi
          echo "APK آماده انتشار روی سایت شد: /apk/SarkhatBot.apk"

      - name: آماده‌سازی Pages (اگر هنوز فعال نیست، بی‌خطا رد می‌شود)
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: آپلود فایل‌های سایت (شامل APK)
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: webapp

      - name: انتشار
        if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
