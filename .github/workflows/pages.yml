name: انتشار وب‌اپ روی GitHub Pages

# اپلیکیشن (پوشه webapp) را روی شاخه gh-pages منتشر می‌کند تا سایت اپ همیشه
# در این آدرس باز شود:
#   https://mayanamin1813-cloud.github.io/sarkhat/
#
# نکته‌ها:
#  • keep_files → پوشه data/ (دیتای زنده مغز ابری) و apk/ (نسخه اندروید)
#    پاک نمی‌شوند و بین انتشارها حفظ می‌شوند.
#  • برخلاف حالت قدیمی، این نسخه حتی اگر Pages هنوز فعال نشده باشد
#    شاخه gh-pages را می‌سازد؛ فعال‌سازی Pages فقط یک‌بار لازم است.

on:
  push:
    branches: [ main ]
    paths:
      - "webapp/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  administration: write    # فقط برای فعال‌سازی خودکار Pages بار اول

concurrency:
  group: gh-pages-data
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: فعال‌سازی Pages (فقط بار اول — خودکار)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/${{ github.repository }}/pages)
          echo "وضعیت فعلی Pages: http=$code"
          if [ "$code" = "200" ]; then
            echo "Pages قبلاً فعال است ✓"
          else
            http=$(curl -s -o /tmp/pages-resp.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages" \
              -d '{"source":{"branch":"gh-pages","path":"/"}}')
            echo "فعال‌سازی Pages: http=$http"
            cat /tmp/pages-resp.json | head -3 || true
            [ "$http" = "201" ] || [ "$http" = "200" ] || [ "$http" = "409" ] && echo "Pages فعال شد ✓" || echo "⚠️ فعال‌سازی خودکار نشد — Settings → Pages → Branch: gh-pages"
          fi

      - name: انتشار webapp در شاخه gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./webapp
          keep_files: true
          user_name: sarkhat-bot
          user_email: actions@users.noreply.github.com
          commit_message: "انتشار وب‌اپ — ${{ github.event.head_commit.message }}"
