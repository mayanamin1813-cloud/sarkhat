name: انتشار وب‌اپ روی GitHub Pages

# اپلیکیشن (پوشه webapp) را روی GitHub Pages منتشر می‌کند:
#   https://mayanamin1813-cloud.github.io/sarkhat/
#
# نکته‌ها:
#  • Pages بار اول به‌صورت خودکار فعال می‌شود (enablement: true)
#  • دیتای زنده (data/live.json) و APK از شاخه ذخیره‌سازی gh-pages برمی‌داریم
#    تا بین انتشارها گم نشوند
#  • مغز ابری (brain.yml) هم همین خروجی را منتشر می‌کند — با گروه همزمانی
#    مشترک، دو انتشار با هم تداخل نمی‌کنند

on:
  push:
    branches: [ main ]
    paths:
      - "webapp/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gh-pages-data
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: بازیابی دیتای زنده و APK از شاخه ذخیره‌سازی gh-pages
        run: |
          mkdir -p webapp/data webapp/apk
          if git clone --depth 1 --branch gh-pages \
              "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ghp 2>/dev/null; then
            cp -f ghp/data/live.json webapp/data/ 2>/dev/null || true
            cp -f ghp/data/brain_state.json webapp/data/ 2>/dev/null || true
            cp -f ghp/apk/*.apk webapp/apk/ 2>/dev/null || true
            echo "دیتای قبلی بازیابی شد: $(ls webapp/data 2>/dev/null) | apk: $(ls webapp/apk 2>/dev/null)"
          else
            echo "شاخه gh-pages هنوز نیست — بدون دیتا منتشر می‌شود (مغز ابری پرش می‌کند)"
          fi

      - name: آماده‌سازی و فعال‌سازی خودکار Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: آپلود فایل‌های سایت
        uses: actions/upload-pages-artifact@v3
        with:
          path: webapp

      - name: انتشار
        id: deployment
        uses: actions/deploy-pages@v4
