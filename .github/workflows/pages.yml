name: انتشار وب‌اپ روی GitHub Pages

# اپلیکیشن PWA را روی GitHub Pages منتشر می‌کند تا بدون نصب هم در مرورگر باز شود:
#   https://<نام-کاربری>.github.io/<نام-مخزن>/
#
# نکته: اگر Pages هنوز از تنظیمات مخزن فعال نشده باشد، این workflow بدون خطا
# رد می‌شود (سبز). بعد از فعال‌کردن (Settings → Pages → Source: GitHub Actions)
# هر push بعدی اپ را منتشر می‌کند.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # روی مخازن خصوصی (پلن رایگان) Pages در دسترس نیست — بدون خطا رد می‌شود
    if: github.event.repository.private == false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: بررسی فعال‌بودن Pages
        id: check
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/${{ github.repository }}/pages)
          echo "pages api http=$code"
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Pages هنوز فعال نشده است — Settings → Pages → Source: GitHub Actions"
          fi

      - name: آماده‌سازی Pages
        if: steps.check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: آپلود فایل‌های webapp
        if: steps.check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: webapp

      - name: انتشار
        if: steps.check.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
