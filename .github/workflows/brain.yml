name: مغز ابری — هر ۵ دقیقه

# این ورک‌فلو «ربات ابری» است — بدون کامپیوتر، سرور رایگان گیت‌هاب:
#   ۱) هر ۵ دقیقه دیتای واقعی بیت‌کوین (۵ دقیقه‌ای) و بورس تهران را می‌گیرد
#   ۲) سیگنال می‌سازد (Watcher → Brain → Executor → Guard)
#   ۳) نتیجه را در data/live.json می‌گذارد و سایت را دوباره منتشر می‌کند
#      تا اپ گوشی همیشه آخرین وضعیت را ببیند
#   ۴) اگر تلگرام تنظیم شده باشد (Secrets: TG_BOT_TOKEN و TG_CHAT_ID)
#      روی سیگنال‌های معتبر پیام می‌دهد

on:
  schedule:
    - cron: "*/5 * * * *"     # هر ۵ دقیقه — ۲۴ ساعته
  workflow_dispatch:            # اجرای دستی برای تست

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gh-pages-data
  cancel-in-progress: false

jobs:
  brain:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: دریافت دیتای قبلی از شاخه ذخیره‌سازی gh-pages
        run: |
          mkdir -p webapp/data webapp/apk
          if git clone --depth 1 --branch gh-pages \
              "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ghp 2>/dev/null; then
            cp -f ghp/data/live.json webapp/data/ 2>/dev/null || true
            cp -f ghp/data/brain_state.json webapp/data/ 2>/dev/null || true
            cp -f ghp/apk/*.apk webapp/apk/ 2>/dev/null || true
            echo "دیتای قبلی: $(ls webapp/data 2>/dev/null)"
          else
            echo "شاخه gh-pages هنوز نیست — از صفر شروع می‌شود"
          fi

      - name: اجرای مغز ابری
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python cloud/brain.py --data-dir webapp/data

      - name: ذخیره دیتای جدید در شاخه gh-pages (حافظه ربات)
        run: |
          CHANGED=$(cat webapp/data/.changed 2>/dev/null || echo 0)
          echo "changed=$CHANGED" >> "$GITHUB_ENV"
          if [ ! -d ghp ]; then
            echo "شاخه ذخیره‌سازی هنوز نیست — بعد از اولین انتشار ساخته می‌شود"
            exit 0
          fi
          mkdir -p ghp/data
          cp -f webapp/data/live.json ghp/data/live.json
          cp -f webapp/data/brain_state.json ghp/data/brain_state.json
          cd ghp
          git config user.name "sarkhat-brain"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          # amend + force تا تاریخچه شاخه حافظه همیشه سبک بماند
          git commit --amend -m "دیتای زنده — $(TZ=Asia/Tehran date '+%Y-%m-%d %H:%M')" >/dev/null
          git push --force origin gh-pages

      - name: آماده‌سازی Pages (اگر هنوز فعال نیست، بی‌خطا رد می‌شود)
        id: pages
        continue-on-error: true
        if: env.changed == '1'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: آپلود فایل‌های سایت (شامل دیتای زنده)
        if: env.changed == '1' && steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: webapp

      - name: انتشار
        if: env.changed == '1' && steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
